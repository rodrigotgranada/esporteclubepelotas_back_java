# ==========================================================
# Configurações Blindadas de Produção (SPRING_PROFILES_ACTIVE=prod)
# Nenhum segredo ou conexão possui fallback padrão.
# ==========================================================
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.tomcat.threads.max=50

# Multipart Upload Limits (Otimizado para containers com pouca RAM)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Swagger / OpenAPI desativados em produção
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ==========================================================
# PostgreSQL & HikariCP (Baixo consumo e fail-fast)
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=300000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================================================
# Segurança, CORS, Cookies & JWT (Obrigatórios)
# ==========================================================
security.jwt.secret=${JWT_SECRET}
security.jwt.expires-in=${JWT_EXPIRES_IN:1h}
frontend.url=${FRONTEND_URL}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.cookie.domain=${COOKIE_DOMAIN:}
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ==========================================================
# Firebase Storage (Obrigatórios)
# ==========================================================
storage.provider=firebase
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64}

# ==========================================================
# Resend E-mail (Obrigatório)
# ==========================================================
resend.api-key=${RESEND_API_KEY}
email.from=${EMAIL_FROM:Esporte Clube Pelotas <atendimento@esporteclubepelotas.com.br>}

