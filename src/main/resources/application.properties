# ==========================================================
# Configurações do Servidor (Desenvolvimento / Local)
# ==========================================================
spring.application.name=esporte-clube-pelotas-api
server.port=${PORT:7998}

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================================
# Swagger / SpringDoc OpenAPI
# ==========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==========================================================
# PostgreSQL / Local Database Configuration
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5433/ecpelotas_local}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:pelotas_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:pelotas_pass}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false

# ==========================================================
# Flyway Database Migrations (Versionamento SQL)
# ==========================================================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================================================
# Segurança, CORS, Cookies & JWT
# ==========================================================
security.jwt.secret=${JWT_SECRET:super-secret-jwt-key-local-dev-esporte-clube-pelotas-1908}
security.jwt.expires-in=${JWT_EXPIRES_IN:1h}
frontend.url=${FRONTEND_URL:http://localhost:7999}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:7999,http://localhost:3000}

app.cookie.domain=${COOKIE_DOMAIN:}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# ==========================================================
# Provedor de Arquivos (Storage)
# ==========================================================
storage.provider=${STORAGE_PROVIDER:firebase}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# ==========================================================
# E-mails & Notificações (Resend)
# ==========================================================
resend.api-key=${RESEND_API_KEY:}
email.from=${EMAIL_FROM:Esporte Clube Pelotas <atendimento@esporteclubepelotas.com.br>}

# ==========================================================
# Cache em Memória (Caffeine com TTL de 5 minutos)
# ==========================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# Integração S2S com a Loja Oficial Alcateia
app.store.internal-api-key=${STORE_INTERNAL_API_KEY:}
app.store.api-url=${STORE_API_URL:http://localhost:7996}
