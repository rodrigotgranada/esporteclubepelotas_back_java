# Configurações do Servidor
spring.application.name=esporte-clube-pelotas-api
server.port=${PORT:8080}

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# PostgreSQL / Neon Database Configuration
# Se SPRING_DATASOURCE_URL for informado, conecta no Neon / PostgreSQL.
# Se não for informado, usa H2 em memória temporariamente para o health check subir.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:pelotas_db;DB_CLOSE_DELAY=-1}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
