# ==========================================================
# Configurações do Servidor
# ==========================================================
spring.application.name=esporte-clube-pelotas-api
server.port=${PORT:7998}

# Actuator Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================================
# Swagger / SpringDoc OpenAPI
# ==========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==========================================================
# PostgreSQL / Neon Database Configuration
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:pelotas_db;DB_CLOSE_DELAY=-1}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false

# ==========================================================
# Flyway Database Migrations (Versionamento SQL)
# ==========================================================
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================================================
# Mensageria (RabbitMQ / CloudAMQP)
# ==========================================================
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:${CLOUDAMQP_URL:amqp://guest:guest@localhost:5672}}
spring.rabbitmq.listener.simple.auto-startup=${SPRING_RABBITMQ_ENABLED:true}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3

# ==========================================================
# Segurança & JWT
# ==========================================================
security.jwt.secret=${JWT_SECRET:super-secret-jwt-key}
security.jwt.expires-in=${JWT_EXPIRES_IN:1h}
frontend.url=${FRONTEND_URL:http://localhost:7999}

# ==========================================================
# Provedor de Arquivos (Storage)
# ==========================================================
storage.provider=${STORAGE_PROVIDER:firebase}
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# AWS S3 (Opcional)
aws.access-key=${AWS_ACCESS_KEY:mock-key}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.bucket-name=${AWS_BUCKET_NAME:}

# ==========================================================
# E-mails & Notificações
# ==========================================================
resend.api-key=${RESEND_API_KEY:}
smtp.user=${SMTP_USER:}
smtp.pass=${SMTP_PASS:}
