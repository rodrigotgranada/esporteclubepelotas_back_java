# Configurações isoladas para testes de integração (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:pelotas_db;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR,MINUTE;INIT=CREATE DOMAIN IF NOT EXISTS jsonb AS JSON;
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desativa Flyway em testes para usar H2 em memória com ddl-auto create-drop
spring.flyway.enabled=false

# Desativa rate limit em massa nos testes de integração sequenciais sobre 127.0.0.1
app.rate-limit.enabled=false
